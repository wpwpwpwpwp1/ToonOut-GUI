name: Build ToonOut release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  windows-release:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Resolve and validate version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $declared = python -c "from app_version import APP_VERSION; print(APP_VERSION)"
          if ($version -ne $declared) {
            throw "Tag version $version does not match APP_VERSION $declared."
          }
          "TOONOUT_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Require update signing configuration
        shell: pwsh
        env:
          UPDATE_SIGNING_PRIVATE_KEY_B64: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY_B64 }}
        run: |
          if (-not $env:UPDATE_SIGNING_PRIVATE_KEY_B64) {
            throw "Missing UPDATE_SIGNING_PRIVATE_KEY_B64 repository secret."
          }
          python -c "from update_config import UPDATE_PUBLIC_KEY_B64; assert UPDATE_PUBLIC_KEY_B64, 'update_config.py has no public key'"

      - name: Verify pinned GPU pack release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $gpuTag = python -c "from gpu_download import GPU_PACK_RELEASE_TAG; print(GPU_PACK_RELEASE_TAG)"
          $manifestName = python -c "from gpu_download import GPU_PACK_MANIFEST_NAME; print(GPU_PACK_MANIFEST_NAME)"
          $checkRoot = Join-Path $env:RUNNER_TEMP "toonout-gpu-pack-release"
          New-Item -ItemType Directory -Path $checkRoot -Force | Out-Null
          gh release download "$gpuTag" `
            --repo "$env:GITHUB_REPOSITORY" `
            --pattern "$manifestName" `
            --dir "$checkRoot"
          gh release view "$gpuTag" `
            --repo "$env:GITHUB_REPOSITORY" `
            --json assets | Out-File `
              -FilePath (Join-Path $checkRoot "assets.json") `
              -Encoding utf8
          python .\scripts\verify_gpu_pack_release.py `
            --manifest (Join-Path $checkRoot $manifestName) `
            --assets-json (Join-Path $checkRoot "assets.json")

      - name: Detect Windows publisher signing configuration
        shell: pwsh
        env:
          WINDOWS_CODESIGN_CERT_B64: ${{ secrets.WINDOWS_CODESIGN_CERT_B64 }}
          WINDOWS_CODESIGN_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PASSWORD }}
        run: |
          if ($env:WINDOWS_CODESIGN_CERT_B64 -and $env:WINDOWS_CODESIGN_PASSWORD) {
            "TOONOUT_SIGNED_RELEASE=true" | Out-File -FilePath $env:GITHUB_ENV -Append
            Write-Output "Authenticode configuration found; publishing a signed release."
          } else {
            "TOONOUT_SIGNED_RELEASE=false" | Out-File -FilePath $env:GITHUB_ENV -Append
            Write-Warning "Authenticode configuration is missing; publishing an unsigned release."
          }

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $output = python -m unittest discover -s tests 2>&1
          $exitCode = $LASTEXITCODE
          $output | ForEach-Object { Write-Output $_ }
          if ($exitCode -ne 0) {
            $annotation = ($output -join "`n").Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=ToonOut test failure::$annotation"
            exit $exitCode
          }

      - name: Build PyInstaller app
        shell: pwsh
        run: .\scripts\build_app.ps1 -Version $env:TOONOUT_VERSION

      - name: Sign application executable
        if: env.TOONOUT_SIGNED_RELEASE == 'true'
        shell: pwsh
        env:
          WINDOWS_CODESIGN_CERT_B64: ${{ secrets.WINDOWS_CODESIGN_CERT_B64 }}
          WINDOWS_CODESIGN_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PASSWORD }}
        run: |
          .\scripts\sign_windows_binary.ps1 `
            -Path ".\build\app\dist\ToonOut\ToonOut.exe" `
            -CertificateBase64 $env:WINDOWS_CODESIGN_CERT_B64 `
            -CertificatePassword $env:WINDOWS_CODESIGN_PASSWORD

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build per-user installer
        shell: pwsh
        run: .\scripts\build_installer.ps1 -Version $env:TOONOUT_VERSION

      - name: Sign installer
        if: env.TOONOUT_SIGNED_RELEASE == 'true'
        shell: pwsh
        env:
          WINDOWS_CODESIGN_CERT_B64: ${{ secrets.WINDOWS_CODESIGN_CERT_B64 }}
          WINDOWS_CODESIGN_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PASSWORD }}
        run: |
          .\scripts\sign_windows_binary.ps1 `
            -Path ".\dist\ToonOut-Setup-$env:TOONOUT_VERSION.exe" `
            -CertificateBase64 $env:WINDOWS_CODESIGN_CERT_B64 `
            -CertificatePassword $env:WINDOWS_CODESIGN_PASSWORD

      - name: Create signed update manifest
        shell: pwsh
        env:
          UPDATE_SIGNING_PRIVATE_KEY_B64: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY_B64 }}
        run: |
          python .\scripts\create_update_manifest.py `
            --installer ".\dist\ToonOut-Setup-$env:TOONOUT_VERSION.exe" `
            --output ".\dist\update.json" `
            --version "$env:TOONOUT_VERSION" `
            --minimum-supported-version "0.1.0" `
            --repository "$env:GITHUB_REPOSITORY" `
            --tag "$env:GITHUB_REF_NAME"

      - name: Publish signed GitHub Release
        if: env.TOONOUT_SIGNED_RELEASE == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" `
            ".\dist\ToonOut-Setup-$env:TOONOUT_VERSION.exe" `
            ".\dist\update.json" `
            --draft `
            --verify-tag `
            --title "ToonOut $env:TOONOUT_VERSION" `
            --generate-notes

      - name: Publish unsigned GitHub Release
        if: env.TOONOUT_SIGNED_RELEASE != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" `
            ".\dist\ToonOut-Setup-$env:TOONOUT_VERSION.exe" `
            ".\dist\update.json" `
            --draft `
            --verify-tag `
            --title "ToonOut $env:TOONOUT_VERSION (unsigned)" `
            --generate-notes
